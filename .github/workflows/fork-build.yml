name: Fork Build

# Fork-only: test a branch and package an arm64 Type4Me.app for personal use.
# The app is signed with this fork's stable self-signed certificate (no Developer ID,
# no notarization), so macOS privacy permissions survive reinstalls of later builds.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        required: true
        default: personal-build
      test_filter:
        description: swift test --filter pattern (empty runs the full suite)
        required: false
        default: DoubaoChatClientTests|CustomHTTPASRTests|BatchASRTranscribersTests|ASRProviderRegistryTests|LLMProviderModelOptionsTests|LLMCredentialDraftTests
      package:
        description: Build and upload the signed app
        type: boolean
        default: true
      app_version:
        description: CFBundleShortVersionString; use the latest official release so its updates are still offered (empty keeps the script default)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Test and package (arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version
          git log --oneline -1

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            swift test --filter "$TEST_FILTER"
          else
            swift test
          fi

      - name: Import signing certificate
        if: inputs.package
        env:
          SIGNING_P12: ${{ secrets.TYPE4ME_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.TYPE4ME_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Type4Me Local Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package
        if: inputs.package
        env:
          VARIANT: cloud
          ARCH: arm64
          CODESIGN_IDENTITY: Type4Me Local Signing
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          APP_BUILD="$GITHUB_RUN_NUMBER" bash scripts/package-app.sh
          codesign -dvv dist/Type4Me.app 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier)="
          codesign -d -r- dist/Type4Me.app
          git rev-parse HEAD > dist/SOURCE_COMMIT
          ditto -c -k --keepParent dist/Type4Me.app dist/Type4Me-arm64.zip

      - name: Upload app
        if: inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Type4Me-arm64
          path: |
            dist/Type4Me-arm64.zip
            dist/SOURCE_COMMIT
          retention-days: 7
